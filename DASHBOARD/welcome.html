<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="description"
        content="AUTONOMOUS SPACE DEBRIS MONITORING AND CAPTURE SYSTEM — ADCS"
    >

    <meta
        name="theme-color"
        content="#050912"
    >

    <title>
        ADCS | Autonomous Space Debris Monitoring and Capture System
    </title>

    <!-- Shared Design System -->
    <link
        rel="stylesheet"
        href="assets/site.css"
    >

    <style>

        /* =====================================================
           ADCS CINEMATIC WELCOME
           ===================================================== */

        :root {
            --welcome-bg: #030711;
            --welcome-line: rgba(180, 210, 240, 0.22);
            --welcome-white: #f4f7fb;
            --welcome-soft: rgba(225, 235, 248, 0.74);
            --welcome-accent: #9fc7ef;
            --welcome-glow: rgba(126, 181, 240, 0.18);
        }


        * {
            box-sizing: border-box;
        }


        html,
        body {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden;
        }


        body {
            background: var(--welcome-bg);
            color: var(--welcome-white);
            font-family:
                Inter,
                "Segoe UI",
                Helvetica,
                Arial,
                sans-serif;
        }


        /* =====================================================
           MAIN STAGE
           ===================================================== */

        .welcome-stage {

            position: relative;

            width: 100%;
            height: 100vh;
            height: 100svh;

            overflow: hidden;

            background:
                radial-gradient(
                    circle at 50% 48%,
                    rgba(60, 100, 150, 0.12),
                    transparent 42%
                ),
                #030711;

            isolation: isolate;

            opacity: 1;

            transform: scale(1);

            transition:
                opacity 1.1s cubic-bezier(.77,0,.18,1),
                transform 1.4s cubic-bezier(.77,0,.18,1);

        }


        .welcome-stage.is-exiting {

            opacity: 0;

            transform: scale(1.035);

            pointer-events: none;

        }


        /* =====================================================
           VIDEO
           ===================================================== */

        .welcome-video {

            position: absolute;

            inset: 0;

            width: 100%;
            height: 100%;

            object-fit: cover;

            background: #030711;

            z-index: -5;

            transform: scale(1.015);

        }


        /*
         * Cinematic treatment over the original video.
         */

        .welcome-video-treatment {

            position: absolute;

            inset: 0;

            z-index: -4;

            pointer-events: none;

            background:
                linear-gradient(
                    180deg,
                    rgba(1, 5, 13, 0.52) 0%,
                    rgba(1, 5, 13, 0.08) 30%,
                    rgba(1, 5, 13, 0.02) 55%,
                    rgba(1, 5, 13, 0.72) 100%
                );

        }


        .welcome-vignette {

            position: absolute;

            inset: 0;

            z-index: -3;

            pointer-events: none;

            background:
                radial-gradient(
                    ellipse at center,
                    transparent 42%,
                    rgba(0, 0, 0, 0.26) 72%,
                    rgba(0, 0, 0, 0.68) 100%
                );

        }


        /* =====================================================
           SUBTLE TECHNICAL GRID
           ===================================================== */

        .welcome-grid {

            position: absolute;

            inset: 0;

            z-index: -2;

            pointer-events: none;

            opacity: 0.16;

            background-image:
                linear-gradient(
                    rgba(190, 215, 240, 0.08) 1px,
                    transparent 1px
                ),
                linear-gradient(
                    90deg,
                    rgba(190, 215, 240, 0.08) 1px,
                    transparent 1px
                );

            background-size:
                72px 72px;

            mask-image:
                linear-gradient(
                    to bottom,
                    transparent,
                    black 18%,
                    black 82%,
                    transparent
                );

        }


        /* =====================================================
           TOP MISSION IDENTIFIER
           ===================================================== */

        .welcome-topline {

            position: absolute;

            top: clamp(24px, 4vh, 46px);
            left: clamp(24px, 4vw, 64px);
            right: clamp(24px, 4vw, 64px);

            display: flex;

            align-items: center;
            justify-content: space-between;

            z-index: 10;

            pointer-events: none;

            animation:
                welcomeTopIn 1.2s
                cubic-bezier(.22,1,.36,1)
                both;

        }


        .welcome-system-mark {

            display: flex;

            align-items: center;

            gap: 12px;

            color:
                rgba(
                    238,
                    244,
                    251,
                    0.88
                );

            font-size: 11px;

            font-weight: 600;

            letter-spacing: 0.2em;

            text-transform: uppercase;

        }


        .welcome-system-dot {

            width: 7px;
            height: 7px;

            border-radius: 50%;

            background:
                #b9d9f7;

            box-shadow:
                0 0 16px
                rgba(
                    165,
                    208,
                    247,
                    0.85
                );

        }


        .welcome-system-status {

            display: flex;

            align-items: center;

            gap: 9px;

            padding:
                8px 12px;

            border:
                1px solid
                rgba(
                    215,
                    230,
                    247,
                    0.16
                );

            background:
                rgba(
                    4,
                    10,
                    20,
                    0.30
                );

            backdrop-filter:
                blur(12px);

            -webkit-backdrop-filter:
                blur(12px);

            color:
                rgba(
                    224,
                    235,
                    247,
                    0.68
                );

            font-size: 9px;

            font-weight: 600;

            letter-spacing: 0.16em;

            text-transform: uppercase;

        }


        /* =====================================================
           CENTRAL CONTENT
           ===================================================== */

        .welcome-content {

            position: absolute;

            inset: 0;

            z-index: 5;

            display: flex;

            align-items: center;
            justify-content: center;

            padding:
                100px 24px 120px;

            text-align: center;

        }


        .welcome-content-inner {

            width: min(
                1180px,
                94vw
            );

            display: flex;

            flex-direction: column;

            align-items: center;

        }


        /* =====================================================
           PROJECT IDENTIFIER
           ===================================================== */

        .welcome-kicker {

            margin: 0 0 22px;

            color:
                rgba(
                    211,
                    228,
                    244,
                    0.76
                );

            font-size:
                clamp(
                    9px,
                    0.7vw,
                    12px
                );

            font-weight: 600;

            letter-spacing:
                clamp(
                    0.28em,
                    0.7vw,
                    0.55em
                );

            text-transform: uppercase;

            opacity: 0;

            transform:
                translateY(18px);

            animation:
                welcomeKickerIn
                1.15s
                0.25s
                cubic-bezier(.22,1,.36,1)
                forwards;

        }


        /* =====================================================
           MAIN TITLE
           ===================================================== */

        .welcome-title {

            margin: 0;

            max-width: 1120px;

            color:
                #f7f9fc;

            /*
             * Elegant serif/calligraphic-style stack.
             * No external font dependency.
             */

            font-family:
                "Baskerville",
                "Iowan Old Style",
                "Palatino Linotype",
                "Book Antiqua",
                Georgia,
                serif;

            font-size:
                clamp(
                    34px,
                    5.2vw,
                    82px
                );

            font-weight: 400;

            line-height: 0.98;

            letter-spacing:
                -0.035em;

            text-wrap: balance;

            text-shadow:
                0 2px 28px
                rgba(
                    0,
                    0,
                    0,
                    0.55
                ),
                0 0 60px
                rgba(
                    113,
                    169,
                    225,
                    0.13
                );

            opacity: 0;

            transform:
                translateY(30px)
                scale(0.985);

            animation:
                welcomeTitleIn
                1.55s
                0.35s
                cubic-bezier(.16,1,.3,1)
                forwards;

        }


        .welcome-title span {

            display: block;

        }


        .welcome-title .title-accent {

            color:
                rgba(
                    224,
                    236,
                    249,
                    0.94
                );

            font-style: italic;

        }


        /* =====================================================
           DIVIDER
           ===================================================== */

        .welcome-divider {

            width:
                clamp(
                    90px,
                    12vw,
                    170px
                );

            height: 1px;

            margin:
                32px 0 22px;

            background:
                linear-gradient(
                    90deg,
                    transparent,
                    rgba(
                        205,
                        226,
                        247,
                        0.76
                    ),
                    transparent
                );

            opacity: 0;

            transform:
                scaleX(0.4);

            animation:
                welcomeDividerIn
                1.1s
                0.75s
                cubic-bezier(.22,1,.36,1)
                forwards;

        }


        /* =====================================================
           ABBREVIATION / SYSTEM IDENTITY
           ===================================================== */

        .welcome-subtitle {

            margin: 0;

            color:
                rgba(
                    221,
                    232,
                    244,
                    0.72
                );

            font-size:
                clamp(
                    10px,
                    1vw,
                    13px
                );

            font-weight: 500;

            letter-spacing:
                0.34em;

            text-transform: uppercase;

            opacity: 0;

            transform:
                translateY(15px);

            animation:
                welcomeSubtitleIn
                1.1s
                0.9s
                cubic-bezier(.22,1,.36,1)
                forwards;

        }


        /* =====================================================
           BOTTOM INFORMATION RAIL
           ===================================================== */

        .welcome-bottom {

            position: absolute;

            left:
                clamp(
                    24px,
                    4vw,
                    64px
                );

            right:
                clamp(
                    24px,
                    4vw,
                    64px
                );

            bottom:
                clamp(
                    26px,
                    4vh,
                    48px
                );

            z-index: 10;

            display: flex;

            align-items: flex-end;

            justify-content: space-between;

            gap: 30px;

            pointer-events: none;

        }


        .welcome-classification {

            display: flex;

            flex-direction: column;

            gap: 6px;

            text-align: left;

            opacity: 0;

            animation:
                welcomeBottomIn
                1s
                1.05s
                cubic-bezier(.22,1,.36,1)
                forwards;

        }


        .welcome-classification-label {

            color:
                rgba(
                    205,
                    220,
                    236,
                    0.45
                );

            font-size: 8px;

            font-weight: 600;

            letter-spacing:
                0.2em;

            text-transform:
                uppercase;

        }


        .welcome-classification-value {

            color:
                rgba(
                    234,
                    241,
                    249,
                    0.76
                );

            font-size: 10px;

            font-weight: 600;

            letter-spacing:
                0.12em;

            text-transform:
                uppercase;

        }


        /* =====================================================
           CONTINUE INDICATOR
           ===================================================== */

        .welcome-enter {

            display: flex;

            align-items: center;

            gap: 14px;

            color:
                rgba(
                    231,
                    240,
                    249,
                    0.72
                );

            font-size: 9px;

            font-weight: 600;

            letter-spacing:
                0.22em;

            text-transform:
                uppercase;

            opacity: 0;

            animation:
                welcomeBottomIn
                1s
                1.2s
                cubic-bezier(.22,1,.36,1)
                forwards;

        }


        .welcome-enter-line {

            width:
                clamp(
                    44px,
                    6vw,
                    82px
                );

            height: 1px;

            background:
                rgba(
                    218,
                    232,
                    246,
                    0.45
                );

        }


        /* =====================================================
           VIDEO PROGRESS
           ===================================================== */

        .welcome-progress {

            position: absolute;

            left: 0;
            bottom: 0;

            width: 100%;
            height: 2px;

            z-index: 30;

            background:
                rgba(
                    255,
                    255,
                    255,
                    0.08
                );

        }


        .welcome-progress-bar {

            width: 0%;

            height: 100%;

            background:
                linear-gradient(
                    90deg,
                    rgba(
                        153,
                        190,
                        225,
                        0.2
                    ),
                    rgba(
                        218,
                        233,
                        248,
                        0.95
                    )
                );

            box-shadow:
                0 0 14px
                rgba(
                    171,
                    211,
                    244,
                    0.45
                );

        }


        /* =====================================================
           FALLBACK ENTER BUTTON
           ===================================================== */

        .welcome-skip {

            position: absolute;

            right:
                clamp(
                    24px,
                    4vw,
                    64px
                );

            bottom:
                clamp(
                    70px,
                    9vh,
                    105px
                );

            z-index: 20;

            padding:
                9px 14px;

            border:
                1px solid
                rgba(
                    215,
                    230,
                    247,
                    0.14
                );

            background:
                rgba(
                    3,
                    9,
                    18,
                    0.28
                );

            color:
                rgba(
                    232,
                    241,
                    249,
                    0.56
                );

            font-family:
                inherit;

            font-size: 8px;

            font-weight: 600;

            letter-spacing:
                0.18em;

            text-transform:
                uppercase;

            cursor: pointer;

            opacity: 0;

            pointer-events: none;

            transition:
                color 220ms ease,
                border-color 220ms ease,
                background 220ms ease;

        }


        .welcome-stage.video-ready
        .welcome-skip {

            opacity: 1;

            pointer-events: auto;

        }


        .welcome-skip:hover {

            color:
                #f2f7fc;

            border-color:
                rgba(
                    215,
                    230,
                    247,
                    0.34
                );

            background:
                rgba(
                    7,
                    16,
                    29,
                    0.54
                );

        }


        /* =====================================================
           LOADING STATE
           ===================================================== */

        .welcome-loading {

            position: absolute;

            left: 50%;
            top: 50%;

            z-index: 50;

            display: flex;

            flex-direction: column;

            align-items: center;

            gap: 14px;

            transform:
                translate(
                    -50%,
                    -50%
                );

            transition:
                opacity 500ms ease;

        }


        .welcome-loading.hidden {

            opacity: 0;

            pointer-events: none;

        }


        .welcome-loader {

            width: 28px;
            height: 28px;

            border-radius: 50%;

            border:
                1px solid
                rgba(
                    215,
                    230,
                    247,
                    0.18
                );

            border-top-color:
                rgba(
                    226,
                    239,
                    251,
                    0.86
                );

            animation:
                welcomeSpin
                900ms
                linear
                infinite;

        }


        .welcome-loading-text {

            color:
                rgba(
                    224,
                    236,
                    247,
                    0.5
                );

            font-size: 8px;

            font-weight: 600;

            letter-spacing:
                0.2em;

            text-transform:
                uppercase;

        }


        /* =====================================================
           ANIMATIONS
           ===================================================== */

        @keyframes welcomeSpin {

            to {
                transform: rotate(360deg);
            }

        }


        @keyframes welcomeTopIn {

            from {
                opacity: 0;
                transform:
                    translateY(-15px);
            }

            to {
                opacity: 1;
                transform:
                    translateY(0);
            }

        }


        @keyframes welcomeKickerIn {

            to {
                opacity: 1;
                transform:
                    translateY(0);
            }

        }


        @keyframes welcomeTitleIn {

            to {
                opacity: 1;
                transform:
                    translateY(0)
                    scale(1);
            }

        }


        @keyframes welcomeDividerIn {

            to {
                opacity: 1;
                transform:
                    scaleX(1);
            }

        }


        @keyframes welcomeSubtitleIn {

            to {
                opacity: 1;
                transform:
                    translateY(0);
            }

        }


        @keyframes welcomeBottomIn {

            to {
                opacity: 1;
            }

        }


        /* =====================================================
           RESPONSIVE
           ===================================================== */

        @media (max-width: 800px) {

            .welcome-topline {

                top: 22px;

            }


            .welcome-system-status {

                display: none;

            }


            .welcome-content {

                padding:
                    80px 20px 120px;

            }


            .welcome-title {

                font-size:
                    clamp(
                        34px,
                        9vw,
                        58px
                    );

                line-height: 1.02;

            }


            .welcome-subtitle {

                max-width: 320px;

                line-height: 1.8;

            }


            .welcome-bottom {

                align-items: flex-start;

            }


            .welcome-enter {

                display: none;

            }

        }


        @media (max-width: 520px) {

            .welcome-grid {

                opacity: 0.08;

                background-size:
                    52px 52px;

            }


            .welcome-title {

                font-size:
                    clamp(
                        31px,
                        10vw,
                        48px
                    );

            }


            .welcome-kicker {

                letter-spacing:
                    0.22em;

            }


            .welcome-divider {

                margin:
                    24px 0 18px;

            }


            .welcome-bottom {

                bottom: 22px;

            }


            .welcome-classification-value {

                font-size: 8px;

            }


            .welcome-skip {

                right: 20px;

                bottom: 66px;

            }

        }


        /* =====================================================
           REDUCED MOTION
           ===================================================== */

        @media (
            prefers-reduced-motion: reduce
        ) {

            .welcome-stage,
            .welcome-title,
            .welcome-kicker,
            .welcome-divider,
            .welcome-subtitle,
            .welcome-topline,
            .welcome-classification,
            .welcome-enter {

                animation: none !important;

                transition: none !important;

                opacity: 1;

                transform: none;

            }

        }

    </style>
</head>


<body>

    <!-- =====================================================
         CINEMATIC WELCOME STAGE
         ===================================================== -->

    <main
        class="welcome-stage"
        id="welcomeStage"
    >


        <!-- =================================================
             ORIGINAL USER VIDEO
             ================================================= -->

        <video
            class="welcome-video"
            id="introVideo"
            autoplay
            muted
            playsinline
            preload="auto"
            aria-label="ADCS introductory mission sequence"
        >
            <source
                src="intro-video.mp4"
                type="video/mp4"
            >

            Your browser does not support HTML5 video.
        </video>


        <!-- Cinematic visual layers -->

        <div
            class="welcome-video-treatment"
            aria-hidden="true"
        ></div>


        <div
            class="welcome-vignette"
            aria-hidden="true"
        ></div>


        <div
            class="welcome-grid"
            aria-hidden="true"
        ></div>


        <!-- =================================================
             TOP IDENTIFICATION
             ================================================= -->

        <div
            class="welcome-topline"
            aria-hidden="true"
        >

            <div class="welcome-system-mark">

                <span
                    class="welcome-system-dot"
                ></span>

                <span>
                    ADCS
                </span>

            </div>


            <div
                class="welcome-system-status"
            >

                <span>
                    ACADEMIC RESEARCH SIMULATION
                </span>

            </div>

        </div>


        <!-- =================================================
             CENTRAL PROJECT IDENTITY
             ================================================= -->

        <section
            class="welcome-content"
            aria-labelledby="welcomeTitle"
        >

            <div
                class="welcome-content-inner"
            >

                <p
                    class="welcome-kicker"
                >
                    AUTONOMOUS ORBITAL DEBRIS OPERATIONS
                </p>


                <h1
                    class="welcome-title"
                    id="welcomeTitle"
                >

                    <span>
                        Autonomous Space Debris
                    </span>

                    <span class="title-accent">
                        Monitoring and Capture System
                    </span>

                </h1>


                <div
                    class="welcome-divider"
                    aria-hidden="true"
                ></div>


                <p
                    class="welcome-subtitle"
                >
                    ADCS
                </p>

            </div>

        </section>


        <!-- =================================================
             LOWER INFORMATION RAIL
             ================================================= -->

        <div
            class="welcome-bottom"
            aria-hidden="true"
        >

            <div
                class="welcome-classification"
            >

                <span
                    class="welcome-classification-label"
                >
                    SYSTEM DOMAIN
                </span>

                <span
                    class="welcome-classification-value"
                >
                    SPACE SITUATIONAL AWARENESS · RPO · CAPTURE
                </span>

            </div>


            <div
                class="welcome-enter"
            >

                <span>
                    INITIALIZING SYSTEM
                </span>

                <span
                    class="welcome-enter-line"
                ></span>

            </div>

        </div>


        <!-- =================================================
             VIDEO LOADING
             ================================================= -->

        <div
            class="welcome-loading"
            id="welcomeLoading"
        >

            <div
                class="welcome-loader"
            ></div>

            <div
                class="welcome-loading-text"
            >
                Loading mission sequence
            </div>

        </div>


        <!-- =================================================
             MANUAL ENTRY / SKIP
             ================================================= -->

        <button
            class="welcome-skip"
            id="welcomeSkip"
            type="button"
            aria-label="Enter ADCS system"
        >
            Enter System
        </button>


        <!-- =================================================
             VIDEO PROGRESS
             ================================================= -->

        <div
            class="welcome-progress"
            aria-hidden="true"
        >

            <div
                class="welcome-progress-bar"
                id="welcomeProgress"
            ></div>

        </div>

    </main>


    <!-- =====================================================
         WELCOME LOGIC
         ===================================================== -->

    <script>

        (() => {

            "use strict";


            /* =================================================
               ELEMENTS
               ================================================= */

            const stage =
                document.getElementById(
                    "welcomeStage"
                );

            const video =
                document.getElementById(
                    "introVideo"
                );

            const loading =
                document.getElementById(
                    "welcomeLoading"
                );

            const progress =
                document.getElementById(
                    "welcomeProgress"
                );

            const skip =
                document.getElementById(
                    "welcomeSkip"
                );


            let leaving =
                false;


            /* =================================================
               HOME DESTINATION
               ================================================= */

            const HOME_PAGE =
                "index.html";


            /* =================================================
               ENTER HOME
               ================================================= */

            function enterHome() {

                if (leaving) {
                    return;
                }

                leaving = true;


                stage.classList.add(
                    "is-exiting"
                );


                /*
                 * Give the cinematic fade enough
                 * time to complete before navigation.
                 */

                window.setTimeout(
                    () => {

                        window.location.href =
                            HOME_PAGE;

                    },
                    1050
                );

            }


            /* =================================================
               VIDEO READY
               ================================================= */

            video.addEventListener(
                "loadeddata",
                () => {

                    loading.classList.add(
                        "hidden"
                    );

                    stage.classList.add(
                        "video-ready"
                    );

                }
            );


            /* =================================================
               VIDEO CAN PLAY
               ================================================= */

            video.addEventListener(
                "canplay",
                () => {

                    loading.classList.add(
                        "hidden"
                    );

                    stage.classList.add(
                        "video-ready"
                    );

                }
            );


            /* =================================================
               VIDEO PROGRESS
               ================================================= */

            video.addEventListener(
                "timeupdate",
                () => {

                    if (
                        !video.duration ||
                        !isFinite(video.duration)
                    ) {
                        return;
                    }


                    const percentage =
                        (
                            video.currentTime /
                            video.duration
                        ) * 100;


                    progress.style.width =
                        `${percentage}%`;

                }
            );


            /* =================================================
               VIDEO ENDED
               ================================================= */

            video.addEventListener(
                "ended",
                () => {

                    progress.style.width =
                        "100%";

                    window.setTimeout(
                        enterHome,
                        450
                    );

                }
            );


            /* =================================================
               VIDEO ERROR
               ================================================= */

            video.addEventListener(
                "error",
                () => {

                    loading.classList.add(
                        "hidden"
                    );

                    stage.classList.add(
                        "video-ready"
                    );

                }
            );


            /* =================================================
               MANUAL ENTRY
               ================================================= */

            skip.addEventListener(
                "click",
                () => {

                    /*
                     * Stop video before transition.
                     */

                    video.pause();

                    enterHome();

                }
            );


            /* =================================================
               AUTOPLAY FALLBACK
               ================================================= */

            const playPromise =
                video.play();


            if (
                playPromise !== undefined
            ) {

                playPromise.catch(
                    () => {

                        /*
                         * Some browsers may block
                         * autoplay. Since the video
                         * is muted, this is uncommon,
                         * but the page remains usable.
                         */

                        stage.classList.add(
                            "video-ready"
                        );

                        loading.classList.add(
                            "hidden"
                        );

                    }
                );

            }


            /* =================================================
               KEYBOARD ENTRY
               ================================================= */

            document.addEventListener(
                "keydown",
                event => {

                    if (
                        event.key === "Enter" ||
                        event.key === " "
                    ) {

                        /*
                         * Do not hijack keyboard input
                         * while a normal interactive
                         * element is focused.
                         */

                        const tag =
                            document.activeElement
                                ?.tagName
                                ?.toLowerCase();

                        if (
                            tag === "button" ||
                            tag === "a" ||
                            tag === "input"
                        ) {
                            return;
                        }


                        event.preventDefault();

                        enterHome();

                    }

                }
            );


            /* =================================================
               SAFETY FALLBACK
               ================================================= */

            /*
             * If the video metadata cannot be loaded
             * after a reasonable period, the user can
             * still enter the system.
             */

            window.setTimeout(
                () => {

                    loading.classList.add(
                        "hidden"
                    );

                    stage.classList.add(
                        "video-ready"
                    );

                },
                5000
            );


        })();

    </script>

</body>
</html>
