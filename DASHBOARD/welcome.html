<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="theme-color"
        content="#12091d"
    >

    <meta
        name="description"
        content="Autonomous Space Debris Monitoring & Capture System"
    >

    <title>
        ADCS | Autonomous Space Debris Monitoring & Capture System
    </title>


    <style>

        /* =========================================================
           ROOT
        ========================================================= */

        :root {

            --deep-purple: #0b0612;
            --purple: #150a21;
            --lavender: #b993e8;

            --white: #f7f3fb;
            --soft-white: rgba(247, 243, 251, 0.78);
            --muted: rgba(226, 214, 240, 0.55);

            --cyan: #73e5ff;
            --cyan-soft: rgba(115, 229, 255, 0.20);

            --border: rgba(224, 200, 255, 0.25);

            --ease:
                cubic-bezier(0.22, 1, 0.36, 1);
        }


        /* =========================================================
           RESET
        ========================================================= */

        *,
        *::before,
        *::after {

            box-sizing: border-box;

        }


        html,
        body {

            width: 100%;
            height: 100%;

            margin: 0;
            padding: 0;

        }


        body {

            overflow: hidden;

            background:
                radial-gradient(
                    circle at center,
                    #261337 0%,
                    #160a23 42%,
                    #0b0612 100%
                );

            color: var(--white);

            font-family:
                Inter,
                "Segoe UI",
                Helvetica,
                Arial,
                sans-serif;

        }


        /* =========================================================
           VIDEO
        ========================================================= */

        #intro {

            position: fixed;

            inset: 0;

            width: 100%;
            height: 100%;

            object-fit: cover;

            object-position: center center;

            background:
                #10071a;

            z-index: 1;

        }


        /* =========================================================
           CINEMATIC VIDEO OVERLAY
        ========================================================= */

        .cinematic-overlay {

            position: fixed;

            inset: 0;

            z-index: 2;

            pointer-events: none;

            background:

                linear-gradient(
                    180deg,
                    rgba(8, 4, 14, 0.40) 0%,
                    rgba(8, 4, 14, 0.05) 27%,
                    rgba(10, 5, 18, 0.08) 50%,
                    rgba(8, 4, 14, 0.55) 100%
                );

        }


        .cinematic-overlay::before {

            content: "";

            position: absolute;

            inset: 0;

            background:

                radial-gradient(
                    ellipse at center,
                    transparent 24%,
                    rgba(7, 3, 12, 0.10) 52%,
                    rgba(7, 3, 12, 0.62) 100%
                );

        }


        .cinematic-overlay::after {

            content: "";

            position: absolute;

            inset: 0;

            background:

                linear-gradient(
                    90deg,
                    rgba(9, 4, 16, 0.28),
                    transparent 25%,
                    transparent 75%,
                    rgba(9, 4, 16, 0.28)
                );

        }


        /* =========================================================
           TOP IDENTIFICATION
        ========================================================= */

        .top-bar {

            position: fixed;

            top: 0;
            left: 0;
            right: 0;

            z-index: 5;

            display: flex;

            align-items: center;
            justify-content: space-between;

            padding:
                30px
                clamp(26px, 5vw, 72px);

            pointer-events: none;

        }


        .system-id {

            display: flex;

            align-items: center;

            gap: 12px;

            color:
                rgba(248, 243, 253, 0.90);

            font-family:
                "SFMono-Regular",
                Consolas,
                monospace;

            font-size: 10px;

            font-weight: 600;

            letter-spacing: 0.22em;

            text-transform: uppercase;

            text-shadow:
                0 3px 18px
                rgba(0, 0, 0, 0.55);

        }


        .system-dot {

            width: 7px;
            height: 7px;

            border-radius: 50%;

            background:
                var(--cyan);

            box-shadow:
                0 0 9px
                rgba(115, 229, 255, 0.90),

                0 0 24px
                rgba(115, 229, 255, 0.34);

        }


        .top-status {

            display: flex;

            align-items: center;

            gap: 8px;

            color:
                rgba(238, 229, 247, 0.58);

            font-family:
                "SFMono-Regular",
                Consolas,
                monospace;

            font-size: 8px;

            letter-spacing: 0.18em;

            text-transform: uppercase;

        }


        /* =========================================================
           CENTER TITLE
        ========================================================= */

        .center-stage {

            position: fixed;

            inset: 0;

            z-index: 4;

            display: flex;

            align-items: center;
            justify-content: center;

            padding:
                100px 24px 130px;

            pointer-events: none;

        }


        .title-block {

            width: min(
                1000px,
                94vw
            );

            text-align: center;

            animation:
                titleReveal
                1.45s
                var(--ease)
                0.15s
                both;

        }


        .pre-title {

            display: flex;

            align-items: center;
            justify-content: center;

            gap: 16px;

            margin-bottom: 24px;

            color:
                var(--cyan);

            font-family:
                "SFMono-Regular",
                Consolas,
                monospace;

            font-size:
                clamp(8px, 0.8vw, 11px);

            font-weight: 600;

            letter-spacing: 0.26em;

            line-height: 1.4;

            text-transform: uppercase;

            text-shadow:
                0 0 22px
                rgba(115, 229, 255, 0.22);

        }


        .pre-title::before,
        .pre-title::after {

            content: "";

            width:
                clamp(30px, 7vw, 90px);

            height: 1px;

            background:

                linear-gradient(
                    90deg,
                    transparent,
                    rgba(115, 229, 255, 0.60)
                );

        }


        .pre-title::after {

            background:

                linear-gradient(
                    90deg,
                    rgba(115, 229, 255, 0.60),
                    transparent
                );

        }


        .project-title {

            margin: 0;

            color:
                var(--white);

            font-family:

                "Arial Narrow",
                "Segoe UI",
                Arial,
                sans-serif;

            font-size:
                clamp(
                    38px,
                    6vw,
                    88px
                );

            font-weight: 700;

            line-height: 0.94;

            letter-spacing:
                -0.045em;

            text-transform: uppercase;

            text-shadow:

                0 4px 28px
                rgba(0, 0, 0, 0.60),

                0 0 60px
                rgba(126, 76, 174, 0.12);

        }


        .project-title .line-one {

            display: block;

            color:
                rgba(249, 246, 253, 0.97);

        }


        .project-title .line-two {

            display: block;

            margin-top: 5px;

            color:
                rgba(231, 219, 244, 0.88);

            font-weight: 400;

            letter-spacing:
                -0.035em;

        }


        .project-subtitle {

            margin:
                27px
                auto
                0;

            max-width: 640px;

            color:
                rgba(238, 230, 247, 0.66);

            font-family:
                "Segoe UI",
                Arial,
                sans-serif;

            font-size:
                clamp(11px, 1vw, 14px);

            font-weight: 400;

            line-height: 1.65;

            letter-spacing: 0.035em;

            text-transform: uppercase;

            text-shadow:
                0 2px 18px
                rgba(0, 0, 0, 0.55);

        }


        /* =========================================================
           CENTER PROJECT CODE
        ========================================================= */

        .mission-code {

            margin-top: 25px;

            color:
                rgba(115, 229, 255, 0.78);

            font-family:
                "SFMono-Regular",
                Consolas,
                monospace;

            font-size: 9px;

            font-weight: 500;

            letter-spacing: 0.28em;

            text-transform: uppercase;

            text-shadow:
                0 0 20px
                rgba(115, 229, 255, 0.18);

        }


        /* =========================================================
           BOTTOM AREA
        ========================================================= */

        .bottom-bar {

            position: fixed;

            left: 0;
            right: 0;
            bottom: 0;

            z-index: 6;

            display: flex;

            align-items: flex-end;

            justify-content: space-between;

            gap: 30px;

            padding:
                30px
                clamp(26px, 5vw, 72px)
                38px;

            pointer-events: none;

        }


        .bottom-info {

            display: flex;

            flex-wrap: wrap;

            align-items: center;

            gap:
                9px
                20px;

            color:
                rgba(235, 225, 244, 0.48);

            font-family:
                "SFMono-Regular",
                Consolas,
                monospace;

            font-size: 8px;

            letter-spacing: 0.16em;

            text-transform: uppercase;

            text-shadow:
                0 2px 15px
                rgba(0, 0, 0, 0.55);

        }


        .bottom-info strong {

            color:
                rgba(247, 241, 251, 0.76);

            font-weight: 500;

        }


        .separator {

            width: 1px;

            height: 11px;

            background:
                rgba(224, 200, 255, 0.25);

        }


        /* =========================================================
           SKIP BUTTON
        ========================================================= */

        .skip {

            pointer-events: auto;

            min-width: 126px;

            height: 40px;

            padding:
                0 16px;

            border:
                1px solid
                rgba(224, 200, 255, 0.30);

            border-radius: 2px;

            background:
                rgba(9, 4, 16, 0.44);

            color:
                rgba(249, 245, 253, 0.90);

            font-family:
                "SFMono-Regular",
                Consolas,
                monospace;

            font-size: 8px;

            font-weight: 600;

            letter-spacing: 0.17em;

            text-transform: uppercase;

            cursor: pointer;

            backdrop-filter:
                blur(10px);

            -webkit-backdrop-filter:
                blur(10px);

            transition:

                border-color 220ms ease,
                background 220ms ease,
                box-shadow 220ms ease,
                transform 220ms var(--ease);

        }


        .skip:hover {

            border-color:
                rgba(115, 229, 255, 0.60);

            background:
                rgba(13, 7, 23, 0.66);

            box-shadow:
                0 0 25px
                rgba(115, 229, 255, 0.08);

            transform:
                translateY(-1px);

        }


        .skip:focus-visible {

            outline:
                1px solid
                var(--cyan);

            outline-offset: 4px;

        }


        /* =========================================================
           VIDEO PROGRESS
        ========================================================= */

        .progress-track {

            position: fixed;

            left: 0;
            right: 0;
            bottom: 0;

            z-index: 8;

            height: 2px;

            background:
                rgba(255, 255, 255, 0.07);

        }


        .progress-fill {

            display: block;

            width: 0%;

            height: 100%;

            background:

                linear-gradient(
                    90deg,
                    rgba(115, 229, 255, 0.92),
                    rgba(185, 145, 237, 0.98)
                );

            box-shadow:
                0 0 15px
                rgba(151, 104, 211, 0.55);

            transition:
                width 80ms linear;

        }


        /* =========================================================
           CORNER DETAILS
        ========================================================= */

        .corner {

            position: fixed;

            z-index: 5;

            width: 38px;
            height: 38px;

            opacity: 0.38;

            pointer-events: none;

        }


        .corner::before,
        .corner::after {

            content: "";

            position: absolute;

            background:
                rgba(225, 203, 251, 0.55);

        }


        .corner::before {

            width: 100%;
            height: 1px;

        }


        .corner::after {

            width: 1px;
            height: 100%;

        }


        .corner.tl {

            top: 20px;
            left: 20px;

        }


        .corner.tr {

            top: 20px;
            right: 20px;

            transform:
                rotate(90deg);

        }


        .corner.bl {

            bottom: 20px;
            left: 20px;

            transform:
                rotate(-90deg);

        }


        .corner.br {

            bottom: 20px;
            right: 20px;

            transform:
                rotate(180deg);

        }


        /* =========================================================
           TRANSITION
        ========================================================= */

        #transition {

            position: fixed;

            inset: 0;

            z-index: 20;

            pointer-events: none;

            opacity: 0;

            background:

                radial-gradient(
                    circle at center,
                    rgba(105, 57, 155, 0.28),
                    rgba(42, 18, 66, 0.40) 40%,
                    rgba(10, 4, 17, 0.96) 100%
                );

            transform:
                scale(1.02);

            transition:

                opacity
                420ms
                var(--ease),

                transform
                600ms
                var(--ease);

        }


        #transition.active {

            opacity: 1;

            transform:
                scale(1);

        }


        /* =========================================================
           TITLE ANIMATION
        ========================================================= */

        @keyframes titleReveal {

            0% {

                opacity: 0;

                transform:
                    translateY(24px)
                    scale(0.985);

                filter:
                    blur(5px);

            }


            100% {

                opacity: 1;

                transform:
                    translateY(0)
                    scale(1);

                filter:
                    blur(0);

            }

        }


        /* =========================================================
           RESPONSIVE
        ========================================================= */

        @media (max-width: 760px) {

            .top-bar {

                padding:
                    22px
                    22px;

            }


            .top-status {

                display: none;

            }


            .center-stage {

                padding:
                    90px
                    20px
                    130px;

            }


            .project-title {

                font-size:
                    clamp(
                        35px,
                        10vw,
                        62px
                    );

            }


            .project-subtitle {

                font-size:
                    10px;

                max-width:
                    500px;

            }


            .bottom-bar {

                padding:
                    22px
                    22px
                    32px;

            }

        }


        @media (max-width: 540px) {

            .system-id {

                font-size: 8px;

                letter-spacing:
                    0.16em;

            }


            .system-id .system-dot {

                width: 5px;
                height: 5px;

            }


            .center-stage {

                padding:
                    80px
                    18px
                    120px;

            }


            .pre-title {

                gap: 9px;

                font-size: 7px;

                letter-spacing:
                    0.16em;

            }


            .pre-title::before,
            .pre-title::after {

                width: 22px;

            }


            .project-title {

                font-size:
                    clamp(
                        31px,
                        10.5vw,
                        50px
                    );

                line-height:
                    0.98;

            }


            .project-title .line-two {

                margin-top: 4px;

            }


            .project-subtitle {

                margin-top: 19px;

                font-size: 8px;

                line-height: 1.6;

                letter-spacing:
                    0.025em;

            }


            .mission-code {

                margin-top: 19px;

                font-size: 7px;

                letter-spacing:
                    0.20em;

            }


            .bottom-bar {

                align-items:
                    flex-end;

                padding:
                    18px
                    18px
                    28px;

            }


            .bottom-info {

                gap:
                    6px
                    10px;

                font-size: 6px;

            }


            .separator {

                display: none;

            }


            .skip {

                min-width:
                    104px;

                height:
                    36px;

                padding:
                    0 12px;

                font-size:
                    7px;

            }


            .corner {

                width:
                    24px;

                height:
                    24px;

            }


            .corner.tl,
            .corner.tr {

                top:
                    14px;

            }


            .corner.bl,
            .corner.br {

                bottom:
                    14px;

            }


            .corner.tl,
            .corner.bl {

                left:
                    14px;

            }


            .corner.tr,
            .corner.br {

                right:
                    14px;

            }

        }


        /* =========================================================
           REDUCED MOTION
        ========================================================= */

        @media (
            prefers-reduced-motion: reduce
        ) {

            *,
            *::before,
            *::after {

                animation-duration:
                    0.001ms !important;

                animation-iteration-count:
                    1 !important;

                transition-duration:
                    0.001ms !important;

            }

        }

    </style>

</head>


<body>


    <!-- =========================================================
         ACTUAL USER INTRO VIDEO
    ========================================================= -->

    <video
        id="intro"
        autoplay
        muted
        playsinline
        preload="auto"
        disablepictureinpicture
        aria-label="Autonomous Space Debris Monitoring and Capture System introduction"
    >

        <source
            src="intro-video.mp4"
            type="video/mp4"
        >

    </video>


    <!-- =========================================================
         CINEMATIC OVERLAY
    ========================================================= -->

    <div
        class="cinematic-overlay"
        aria-hidden="true"
    ></div>


    <!-- =========================================================
         CORNER MARKERS
    ========================================================= -->

    <div
        class="corner tl"
        aria-hidden="true"
    ></div>

    <div
        class="corner tr"
        aria-hidden="true"
    ></div>

    <div
        class="corner bl"
        aria-hidden="true"
    ></div>

    <div
        class="corner br"
        aria-hidden="true"
    ></div>


    <!-- =========================================================
         TOP IDENTIFICATION
    ========================================================= -->

    <header class="top-bar">


        <div class="system-id">

            <span
                class="system-dot"
                aria-hidden="true"
            ></span>

            <span>
                ADCS
            </span>

        </div>


        <div class="top-status">

            <span>
                MISSION INITIALIZATION
            </span>

            <span>
                /
            </span>

            <span>
                SYSTEM READY
            </span>

        </div>


    </header>


    <!-- =========================================================
         CENTRAL PROJECT TITLE
    ========================================================= -->

    <main class="center-stage">


        <section class="title-block">


            <div class="pre-title">

                AUTONOMOUS ORBITAL OPERATIONS

            </div>


            <h1 class="project-title">


                <span class="line-one">

                    AUTONOMOUS SPACE DEBRIS

                </span>


                <span class="line-two">

                    MONITORING &amp; CAPTURE SYSTEM

                </span>


            </h1>


            <p class="project-subtitle">

                Orbital surveillance · target assessment ·
                relative navigation · controlled capture

            </p>


            <div class="mission-code">

                ADCS-01 &nbsp;·&nbsp; LEO MISSION SYSTEM

            </div>


        </section>


    </main>


    <!-- =========================================================
         BOTTOM INFORMATION
    ========================================================= -->

    <footer class="bottom-bar">


        <div class="bottom-info">


            <span>
                MISSION
                <strong>
                    ADCS-01
                </strong>
            </span>


            <span class="separator"></span>


            <span>
                DOMAIN
                <strong>
                    LOW EARTH ORBIT
                </strong>
            </span>


            <span class="separator"></span>


            <span>
                MODE
                <strong>
                    AUTONOMOUS
                </strong>
            </span>


        </div>


        <button
            id="skip"
            class="skip"
            type="button"
        >

            SKIP INTRO

        </button>


    </footer>


    <!-- =========================================================
         VIDEO PROGRESS
    ========================================================= -->

    <div
        class="progress-track"
        aria-hidden="true"
    >

        <span
            id="bar"
            class="progress-fill"
        ></span>

    </div>


    <!-- =========================================================
         CINEMATIC PAGE TRANSITION
    ========================================================= -->

    <div
        id="transition"
        aria-hidden="true"
    ></div>


    <!-- =========================================================
         JAVASCRIPT
    ========================================================= -->

    <script>

        (() => {

            "use strict";


            /* -----------------------------------------------------
               ELEMENT REFERENCES
            ----------------------------------------------------- */

            const video =
                document.getElementById(
                    "intro"
                );


            const skip =
                document.getElementById(
                    "skip"
                );


            const bar =
                document.getElementById(
                    "bar"
                );


            const transition =
                document.getElementById(
                    "transition"
                );


            /* -----------------------------------------------------
               NAVIGATION STATE
            ----------------------------------------------------- */

            let leaving =
                false;


            /* -----------------------------------------------------
               ENTER HOME
            ----------------------------------------------------- */

            function enterHome() {


                if (leaving) {

                    return;

                }


                leaving =
                    true;


                /*
                 * The Home page uses this flag to create a smooth
                 * handoff from the welcome screen.
                 */

                try {

                    sessionStorage.setItem(
                        "adcsIntroComplete",
                        "1"
                    );

                }

                catch (error) {

                    /*
                     * Navigation should continue even if session
                     * storage is unavailable.
                     */

                }


                /*
                 * Stop the video.
                 */

                try {

                    video.pause();

                }

                catch (error) {

                    /* Safe to ignore. */

                }


                /*
                 * Start the purple cinematic fade.
                 */

                transition.classList.add(
                    "active"
                );


                /*
                 * Keep this transition short.
                 * It should feel like a cinematic handoff,
                 * not a loading screen.
                 */

                window.setTimeout(
                    () => {

                        window.location.replace(
                            "index.html"
                        );

                    },
                    460
                );

            }


            /* -----------------------------------------------------
               VIDEO PROGRESS
            ----------------------------------------------------- */

            video.addEventListener(
                "timeupdate",
                () => {


                    if (
                        Number.isFinite(
                            video.duration
                        ) &&
                        video.duration > 0
                    ) {


                        const percentage =

                            (
                                video.currentTime /
                                video.duration
                            ) * 100;


                        bar.style.width =

                            Math.min(
                                100,
                                Math.max(
                                    0,
                                    percentage
                                )
                            ) + "%";


                    }

                }
            );


            /* -----------------------------------------------------
               VIDEO COMPLETE
            ----------------------------------------------------- */

            video.addEventListener(
                "ended",
                enterHome
            );


            /* -----------------------------------------------------
               SKIP
            ----------------------------------------------------- */

            skip.addEventListener(
                "click",
                enterHome
            );


            /* -----------------------------------------------------
               ESCAPE
            ----------------------------------------------------- */

            document.addEventListener(
                "keydown",
                (event) => {


                    if (
                        event.key === "Escape" &&
                        !leaving
                    ) {

                        enterHome();

                    }

                }
            );


            /* -----------------------------------------------------
               AUTOPLAY
            ----------------------------------------------------- */

            function startVideo() {


                const promise =
                    video.play();


                if (
                    promise &&
                    typeof promise.catch ===
                    "function"
                ) {


                    promise.catch(
                        () => {

                            /*
                             * The video remains visible and the
                             * Skip Intro button remains available.
                             */

                        }
                    );


                }

            }


            if (
                video.readyState >= 2
            ) {

                startVideo();

            }

            else {

                video.addEventListener(
                    "loadeddata",
                    startVideo,
                    {
                        once: true
                    }
                );

            }


        })();

    </script>


</body>

</html>
