<script>
/* =========================================================
   MISSION DOSSIER — PHASE IMAGE REGISTRY
   Images are stored inside:
   DASHBOARD/assets/
   ========================================================= */

const PHASE_IMAGES = {
    1:  "assets/Phase 1.png",
    2:  "assets/Phase 2.png",
    3:  "assets/Phase 3.png",
    4:  "assets/Phase 4.png",
    5:  "assets/Phase 5.png",
    6:  "assets/Phase 6.png",
    7:  "assets/Phase 7.png",
    8:  "assets/Phase 8.jpeg",
    9:  "assets/Phase 9.jpeg",
    10: "assets/Phase 10.jpeg",
    11: "assets/Phase 11.jpeg",
    12: "assets/Phase 12.jpeg",
    13: "assets/Phase 13.jpeg",
    14: "assets/Phase 14.jpeg",
    15: "assets/Phase 15.jpeg"
};


/* =========================================================
   LOAD A PHASE IMAGE
   ========================================================= */

function loadPhaseImage(phaseNumber, container) {

    if (!container) return;

    const imagePath = PHASE_IMAGES[phaseNumber];

    if (!imagePath) {
        container.innerHTML = `
            <div class="phase-image-error">
                PHASE IMAGE UNAVAILABLE
            </div>
        `;
        return;
    }

    const img = new Image();

    img.className = "phase-image";

    img.alt =
        `Mission Dossier Phase ${String(phaseNumber).padStart(2, "0")} engineering visualization`;

    /*
       encodeURI converts spaces in filenames such as:

       Phase 1.png

       into:

       Phase%201.png

       without changing the actual filename.
    */
    img.src = encodeURI(imagePath);

    img.onload = function () {

        container.innerHTML = "";

        container.appendChild(img);

        container.classList.add("image-loaded");
    };

    img.onerror = function () {

        console.error(
            `Mission Dossier: unable to load phase image ${phaseNumber}`,
            imagePath
        );

        container.innerHTML = `
            <div class="phase-image-error">
                <span>PHASE ${String(phaseNumber).padStart(2, "0")}</span>
                <strong>IMAGE LOAD ERROR</strong>
                <small>${imagePath}</small>
            </div>
        `;
    };
}


/* =========================================================
   INITIALISE ALL PHASE IMAGES
   ========================================================= */

document.addEventListener("DOMContentLoaded", () => {

    document
        .querySelectorAll("[data-phase-image]")
        .forEach(container => {

            const phaseNumber =
                Number(container.dataset.phaseImage);

            loadPhaseImage(
                phaseNumber,
                container
            );
        });

});
</script>
